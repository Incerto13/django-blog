# Local / single-host run. The app serves its own static files (WhiteNoise),
# so the old nginx and (unused) redis containers are gone: web + postgres only,
# matching the one-pod-per-app layout used on Kubernetes.
services:

  web:
    build: ./web
    restart: unless-stopped
    env_file: ./web/app.env
    environment:
      DB_HOST: postgres
    depends_on:
      - postgres
    ports:
      - "8001:8000"

  postgres:
    image: postgres:17-alpine   # official image creates POSTGRES_USER / POSTGRES_DB itself
    restart: unless-stopped
    env_file: ./web/app.env
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
